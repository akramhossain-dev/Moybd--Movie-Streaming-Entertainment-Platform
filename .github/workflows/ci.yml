name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ESLint Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install
          cd frontend && npm ci || npm install
          cd ../backend && npm ci || npm install

      - name: Run ESLint (Frontend)
        run: npm run lint:frontend

  backend-check:
    name: Backend Syntax & Module Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Backend Dependencies
        run: |
          cd backend && (npm ci || npm install)

      - name: Validate Backend Syntax
        run: node --check backend/main.js

  build:
    name: Production Build Validation
    runs-on: ubuntu-latest
    needs: [lint, backend-check]
    env:
      NEXT_PUBLIC_API_URL: https://api.moybd.sbs
      NEXT_PUBLIC_AES_SECRET: ci_build_validation_secret_key
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: |
          cd frontend && (npm ci || npm install)

      - name: Build Next.js Production Bundle
        run: npm run build:frontend
